name: Deploy ImmoZen Tanger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Tanger to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 22
          key: ${{ secrets.VPS_SSH_KEY }}
          debug: true

          script: |
            set -e

            echo "🚀 Déploiement ImmoZen Tanger..."

            cd /var/www/immozen-tanger

            echo "📥 Récupération du code..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Installation des dépendances..."
            npm ci

            echo "🔨 Build Next.js..."
            npm run build

            echo "♻️ Redémarrage PM2..."
            pm2 restart immozen-tanger

            echo "💾 Sauvegarde PM2..."
            pm2 save

            echo "✅ Déploiement ImmoZen Tanger terminé !"